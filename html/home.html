<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <title>ECHO Wear: A High quality clothing brand for your lifestyle</title>
    <link rel="stylesheet" href="../css/home.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F5F0E8; color: #1C1C1E; }
        .navbar { background: #FFFFFF; border-bottom: 1px solid #E5E0D5; }
        .navbar-brand { font-family: 'Kanit', sans-serif; font-weight: 800; }
        .navbar-brand span { font-weight: 300; color: #6B6868; }
        .nav-link.active { font-weight: 700; color: #1C1C1E !important; }
        .badge-count { background: #1C1C1E; }
</style>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-md">
            <div class="container">
                <a class="navbar-brand" href="index.html">ECHO<span>WEAR</span></a>

                <button class="navbar-toggler" type="button" id="menuBtn">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navMenu">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="products.html">Shop</a></li>
                        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="catBtn">Categories</a>
                            <ul class="dropdown-menu" id="catMenu">
                                <li><a class="dropdown-item" href="products.html?cat=tops">Tops</a></li>
                                <li><a class="dropdown-item" href="products.html?cat=bottoms">Bottoms</a></li>
                                <li><a class="dropdown-item" href="products.html?cat=accessories">Accessories</a></li>
                            </ul>
                        </li>
                    </ul>

                    <div class="d-flex gap-2">
                        <a href="wishlist.html" class="btn position-relative">
                            &#9825;
                            <span
                                class="badge badge-count rounded-circle position-absolute top-0 start-100 translate-middle">2</span>
                        </a>
                        <a href="cart.html" class="btn position-relative">
                            &#128092;
                            <span
                                class="badge badge-count rounded-circle position-absolute top-0 start-100 translate-middle">3</span>
                        </a>
                        <a href="auth.html" class="btn">&#128100;</a>
                    </div>
                </div>
            </div>
            </nav>

            <script>
                // فتح/سكر قائمة الموبايل
                document.getElementById("menuBtn").addEventListener("click", function () {
                    document.getElementById("navMenu").classList.toggle("show");
                });

                // فتح/سكر Categories dropdown
                document.getElementById("catBtn").addEventListener("click", function (e) {
                    e.preventDefault();
                    document.getElementById("catMenu").classList.toggle("show");
                });
            </script>
    </header>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
