<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/login.css">
    <title>ECHO Wear - Sign In</title>
</head>

<body>

<div class="page">

    <section class="left-side">
        <a href="home.html" style="text-decoration: none;">
            <div class="logo">
                <b>ECHO</b> <span>WEAR</span>
            </div>
        </a>

        <div class="small-title">
            YOUR STYLE, YOUR ECHO
        </div>

        <h1 class="main-title">
            WEAR<br>
            WHO<br>
            YOU ARE
        </h1>

        <p class="description">
            Join thousands of people making their mark.
            Get early access to new drops, save favorites,
            and track your orders in one place.
        </p>

        <div class="bottom-image">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSdeb1U0pblmtVnkzsyLl3-CgaB9Ywnn9NoaqoJXk_gSA&s=10" alt="ECHO Wear">
        </div>

    </section>

    <section class="right-side">

        <div class="form-container">

            <h2 class="form-title">
                Sign In
            </h2>

            <p class="form-subtitle">
                Welcome back to ECHO Wear.
            </p>

            <form>

                <div class="form-group">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        placeholder="you@example.com"
                    >

                </div>

                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        placeholder="Min. 8 characters"
                    >

                </div>

                <div class="remember-row">

                    <div class="remember">

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        <label for="remember">
                            Remember me
                        </label>

                    </div>

                    <a
                        href="#"
                        class="forgot"
                    >
                        Forgot password?
                    </a>

                </div>

                <button
                    type="submit"
                    class="signin-btn"
                >
                    SIGN IN
                </button>

                <p class="bottom-text">
                    Don't have an account?
                    <a href="rejester.html">
                        Sign up
                    </a>
                </p>

            </form>

        </div>

    </section>

</div>

</body>
</html>
